<div class="detail-row">
  <div class="row g-3 align-items-center">
    <div class="col-md-2 col-4">
      <div class="detail-thumb-wrap">
        <img src="assets/product.png" class="detail-thumb" alt="utilisateur">
      </div>
    </div>

    <div class="col-md-4 col-8">
      <div class="detail-info-line">
        <i class="fas fa-user"></i>
        <span>Nom</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-user"></i>
        <span>Prénom</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-phone"></i>
        <span>Numéro de téléphone</span>
      </div>
    </div>

    <div class="col-md-3 col-12">
      <span class="detail-section-label">Adresse</span>
      <div class="detail-info-line">
        <i class="fas fa-home"></i>
        <span>Adresse 1 &amp; 2</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-location-dot"></i>
        <span>Code postal &amp; Ville</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-earth-europe"></i>
        <span>Pays</span>
      </div>
    </div>

    <div class="col-md-3 col-12">
      <div class="detail-actions">
        <button type="button" class="btn btn-sm btn-outline-primary">
          <i class="fas fa-pen"></i>&nbsp;Modifier
        </button>
        <button type="button" class="btn btn-sm btn-outline-danger">
          <i class="fas fa-trash"></i>&nbsp;Supprimer
        </button>
        <button type="button" class="btn btn-sm btn-secondary">
          <i class="far fa-list-alt"></i>&nbsp;Détails
        </button>
      </div>
    </div>
  </div>
