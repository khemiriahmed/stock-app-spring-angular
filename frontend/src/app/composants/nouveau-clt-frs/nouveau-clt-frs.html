<div class="form-page fade-in">
  <div class="page-head">
    <div>
      <h1 class="page-title">Nouveau {{ origin === 'fournisseur' ? 'fournisseur' : 'client' }}</h1>
      <p class="page-subtitle">
        Renseignez les informations du {{ origin === 'fournisseur' ? 'fournisseur' : 'client' }}.
      </p>
    </div>
    <button type="button" class="btn btn-secondary" (click)="cancelClick()">
      <i class="fas fa-arrow-left"></i>&nbsp;Retour
    </button>
  </div>

  <div class="section-card">
    <h3 class="form-section-title">
      <i class="fas fa-address-card blue-color"></i>&nbsp;Informations générales
    </h3>

    <div class="form-grid">
      <div class="field">
        <label>Nom</label>
        <input type="text" class="form-input" placeholder="Nom">
      </div>
      <div class="field">
        <label>Prénom</label>
        <input type="text" class="form-input" placeholder="Prénom">
      </div>
      <div class="field">
        <label>Adresse</label>
        <input type="text" class="form-input" placeholder="Adresse">
      </div>
      <div class="field">
        <label>Code postal</label>
        <input type="text" class="form-input" placeholder="Code postal">
      </div>
      <div class="field">
        <label>Ville</label>
        <input type="text" class="form-input" placeholder="Ville">
      </div>
      <div class="field">
        <label>Pays</label>
        <input type="text" class="form-input" placeholder="Pays">
      </div>
      <div class="field">
        <label>Numéro de téléphone</label>
        <input type="text" class="form-input" placeholder="Téléphone">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" class="form-input" placeholder="Email">
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancelClick()">
        <i class="fas fa-ban"></i>&nbsp;Annuler
      </button>
      <button type="button" class="btn btn-primary" (click)="saveClick()">
        <i class="fas fa-save"></i>&nbsp;Enregistrer
      </button>
    </div>
  </div>
</div>
