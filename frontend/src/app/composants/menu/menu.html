<nav class="sidebar-nav">
  <div class="nav-group" *ngFor="let menu of menuProperties">
    <button
      type="button"
      class="nav-group-title"
      [class.open]="menu.open"
      (click)="toggleGroupe(menu)"
    >
      <i class="{{ menu.icon }} nav-icon"></i>
      <span class="nav-label">{{ menu.titre }}</span>
      <i class="fas fa-chevron-down nav-chevron" [class.rotated]="menu.open"></i>
    </button>

    <div class="nav-submenu" [class.open]="menu.open">
      <a
        href="javascript:void(0);"
        class="nav-item"
        *ngFor="let sousMenu of menu.sousMenu"
        [class.active]="sousMenu.active"
        (click)="navigate(sousMenu)"
      >
        <i class="{{ sousMenu.icon }} nav-item-icon"></i>
        <span>{{ sousMenu.titre }}</span>
      </a>
    </div>
  </div>
</nav>
