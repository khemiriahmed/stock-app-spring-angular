<div class="form-page fade-in">
  <div class="page-head">
    <div>
      <h1 class="page-title">Nouvelle commande {{ origin === 'fournisseur' ? 'fournisseur' : 'client' }}</h1>
      <p class="page-subtitle">Créez une commande et ajoutez-y des lignes.</p>
    </div>
  </div>

  <!-- En-tête commande -->
  <div class="section-card">
    <div class="order-head">
      <div class="order-form">
        <div class="field">
          <label>Code commande</label>
          <input type="text" class="form-input" placeholder="Code commande">
        </div>
        <div class="field">
          <label>Date de commande</label>
          <input type="date" class="form-input">
        </div>
        <div class="field">
          <label>{{ origin === 'fournisseur' ? 'Fournisseur' : 'Client' }}</label>
          <select class="form-input">
            <option>Sélectionner</option>
            <option>Client / Fournisseur</option>
          </select>
        </div>
      </div>

      <div class="order-summary">
        <div class="detail-info-line">
          <i class="fas fa-user"></i>
          <span>Nom du client / fournisseur</span>
        </div>
        <div class="detail-info-line">
          <i class="fas fa-phone"></i>
          <span>Numéro de téléphone</span>
        </div>
        <div class="detail-info-line">
          <i class="fas fa-envelope"></i>
          <span>Email</span>
        </div>
        <div class="detail-info-line">
          <i class="fas fa-circle-info blue-color"></i>
          <span>Adresse complète</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Ajout d'une ligne -->
  <div class="section-card">
    <h3 class="form-section-title">
      <i class="fas fa-plus-circle blue-color"></i>&nbsp;Ajouter un article
    </h3>
    <div class="line-add">
      <div class="field">
        <label>Article</label>
        <input type="text" class="form-input" placeholder="Code article">
      </div>
      <div class="field">
        <label>Quantité</label>
        <input type="number" class="form-input" placeholder="0">
      </div>
      <div class="field">
        <label>Prix unitaire</label>
        <input type="text" class="form-input" placeholder="0,00 €">
      </div>
      <div class="field field-btn">
        <button type="button" class="btn btn-success"><i class="fas fa-plus"></i></button>
      </div>
    </div>
  </div>

  <!-- Lignes de commande -->
  <div class="section-card">
    <h3 class="form-section-title">
      <i class="fas fa-list blue-color"></i>&nbsp;Lignes de commande
    </h3>
    <div class="cmd-lines">
      <app-detail-cmd></app-detail-cmd>
    </div>
  </div>

  <!-- Total + actions -->
  <div class="order-footer">
    <h3 class="order-total">Total de la commande : <span class="blue-color">0 €</span></h3>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary">
        <i class="fas fa-ban"></i>&nbsp;Annuler
      </button>
      <button type="button" class="btn btn-primary">
        <i class="fas fa-save"></i>&nbsp;Enregistrer
      </button>
    </div>
  </div>
</div>
