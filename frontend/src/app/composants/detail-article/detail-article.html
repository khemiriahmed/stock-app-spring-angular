<div class="detail-row">
  <div class="row g-3 align-items-center">
    <!-- Image -->
    <div class="col-md-2 col-4">
      <div class="detail-thumb-wrap">
        <img src="assets/product.png" class="detail-thumb" alt="article">
      </div>
    </div>

    <!-- Infos article -->
    <div class="col-md-4 col-8">
      <div class="detail-info-line">
        <i class="fas fa-barcode"></i>
        <span>Code article</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-tag"></i>
        <span>Désignation</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-euro-sign"></i>
        <span>Prix HT</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-euro-sign"></i>
        <span>Prix TTC</span>
      </div>
    </div>

    <!-- Catégorie -->
    <div class="col-md-3 col-12">
      <span class="detail-section-label">Catégorie</span>
      <div class="detail-info-line">
        <i class="fas fa-flag-checkered"></i>
        <div class="d-flex flex-column">
          <span>Code</span>
          <small class="text-muted">Désignation</small>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="col-md-3 col-12">
      <div class="detail-actions">
        <button type="button" class="btn btn-sm btn-outline-primary">
          <i class="fas fa-pen"></i>&nbsp;Modifier
        </button>
        <button type="button" class="btn btn-sm btn-outline-danger">
          <i class="fas fa-trash"></i>&nbsp;Supprimer
        </button>
        <button type="button" class="btn btn-sm btn-secondary">
          <i class="far fa-list-alt"></i>&nbsp;Détails
        </button>
      </div>
    </div>
  </div>

  <!-- Modal suppression -->
  <div class="modal fade" id="modalDeleteArticle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Êtes-vous sûr de vouloir supprimer cet article ?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-ban"></i>&nbsp;Annuler
          </button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="fas fa-trash"></i>&nbsp;Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
