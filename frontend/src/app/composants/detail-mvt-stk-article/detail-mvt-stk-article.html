<div class="detail-row mvt-article">
  <div class="row g-3 align-items-center">
    <div class="col-md-2 col-4">
      <div class="detail-thumb-wrap">
        <img src="assets/product.png" class="detail-thumb" alt="article">
      </div>
    </div>

    <div class="col-md-5 col-8">
      <div class="detail-info-line">
        <i class="fas fa-barcode"></i>
        <span>Code article</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-tag"></i>
        <span>Désignation</span>
      </div>
      <div class="detail-info-line">
        <i class="fas fa-euro-sign"></i>
        <span>Prix HT</span>
      </div>
    </div>

    <div class="col-md-2 col-6">
      <span class="detail-section-label">Stock actuel</span>
      <div class="stock-pill">139</div>
    </div>

    <div class="col-md-3 col-6">
      <div class="detail-actions">
        <button type="button" class="btn btn-sm btn-outline-primary"
                data-bs-toggle="modal" data-bs-target="#modalCorrectionStock">
          <i class="fas fa-sliders"></i>&nbsp;Correction de stock
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalCorrectionStock" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Correction de stock</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Quantité</label>
          <input type="text" class="form-input" placeholder="Quantité">
        </div>
        <div class="field">
          <label>Type de correction</label>
          <select class="form-input">
            <option>Correction positive</option>
            <option>Correction négative</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-ban"></i>&nbsp;Annuler
        </button>
        <button type="button" class="btn btn-primary">
          <i class="fas fa-save"></i>&nbsp;Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>
