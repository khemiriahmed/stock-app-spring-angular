<div class="list-page fade-in">
  <div class="page-head">
    <div>
      <h1 class="page-title">Commandes</h1>
      <p class="page-subtitle">Suivez les commandes clients et fournisseurs.</p>
    </div>
    <app-button-action (clickEvent)="nouvelleCommande()"></app-button-action>
  </div>

  <div class="accordion" id="commandesAccordion">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseCmd1" aria-expanded="true">
          <app-detail-cmd-clt-frs></app-detail-cmd-clt-frs>
        </button>
      </h2>
      <div id="collapseCmd1" class="collapse show" data-bs-parent="#commandesAccordion">
        <div class="accordion-body cmde-lines">
          <app-detail-cmd></app-detail-cmd>
        </div>
        <div class="card-footer">
          <div class="row">
            <div class="col-md-6 text-start">
              <h5 class="mb-0">Lignes de commande</h5>
            </div>
            <div class="col-md-6 text-end">
              <h5 class="mb-0">Total commande : <span class="blue-color">0</span></h5>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="list-pagination">
    <app-pagination></app-pagination>
  </div>
</div>
