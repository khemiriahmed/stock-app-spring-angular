<div class="list-page fade-in">
  <div class="page-head">
    <div>
      <h1 class="page-title">Mouvements du stock</h1>
      <p class="page-subtitle">Historique des entrées, sorties et corrections de stock.</p>
    </div>
    <app-button-action [isImporterVisible]="false" [isNouveauVisible]="false"></app-button-action>
  </div>

  <div class="accordion" id="mvtStkDetails">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
          <app-detail-mvt-stk-article></app-detail-mvt-stk-article>
        </button>
      </h2>
      <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#mvtStkDetails">
        <div class="accordion-body mvt-list">
          <app-detail-mvt-stk></app-detail-mvt-stk>
          <app-detail-mvt-stk></app-detail-mvt-stk>
          <app-detail-mvt-stk></app-detail-mvt-stk>
          <app-detail-mvt-stk></app-detail-mvt-stk>
        </div>
      </div>
    </div>

    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
          <app-detail-mvt-stk-article></app-detail-mvt-stk-article>
        </button>
      </h2>
      <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#mvtStkDetails">
        <div class="accordion-body">
          <app-detail-mvt-stk></app-detail-mvt-stk>
          <app-detail-mvt-stk></app-detail-mvt-stk>
          <app-detail-mvt-stk></app-detail-mvt-stk>
        </div>
      </div>
    </div>
  </div>

  <div class="list-pagination">
    <app-pagination></app-pagination>
  </div>
</div>
