<div class="form-page fade-in">
  <div class="page-head">
    <div>
      <h1 class="page-title">Changer mot de passe</h1>
      <p class="page-subtitle">Mettez à jour le mot de passe de votre compte.</p>
    </div>
    <button type="button" class="btn btn-secondary" (click)="cancel()">
      <i class="fas fa-arrow-left"></i>&nbsp;Retour
    </button>
  </div>

  <div class="pwd-layout">
    <div class="section-card pwd-profile">
      <div class="uploader-circle mb-3">
        <i class="fas fa-user"></i>
      </div>
      <h3 class="mb-1">Nom Prénom</h3>
      <p class="page-subtitle mb-0">nom@email.com</p>
    </div>

    <div class="section-card pwd-form">
      <h3 class="form-section-title">
        <i class="fas fa-key blue-color"></i>&nbsp;Sécurité
      </h3>

      <div class="field">
        <label>Mot de passe actuel</label>
        <input type="password" class="form-input" placeholder="Mot de passe actuel">
      </div>
      <div class="field">
        <label>Nouveau mot de passe</label>
        <input type="password" class="form-input" placeholder="Nouveau mot de passe">
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <input type="password" class="form-input" placeholder="Confirmer le mot de passe">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          <i class="fas fa-ban"></i>&nbsp;Annuler
        </button>
        <button type="button" class="btn btn-primary">
          <i class="fas fa-save"></i>&nbsp;Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>
