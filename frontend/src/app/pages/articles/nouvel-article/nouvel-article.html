<div class="form-page fade-in">
  <div class="page-head">
    <div>
      <h1 class="page-title">Nouvel article</h1>
      <p class="page-subtitle">Ajoutez un article à votre catalogue.</p>
    </div>
    <button type="button" class="btn btn-secondary" (click)="cancel()">
      <i class="fas fa-arrow-left"></i>&nbsp;Retour
    </button>
  </div>

  <div class="section-card">
    <div class="form-layout">
      <!-- Photo -->
      <div class="photo-uploader">
        <div class="uploader-circle">
          <i class="fas fa-camera"></i>
          <img class="preview" alt="" />
        </div>
        <span class="uploader-hint">Cliquez pour ajouter une photo</span>
        <input hidden type="file">
      </div>

      <!-- Champs -->
      <div class="form-fields">
        <h3 class="form-section-title">
          <i class="fas fa-circle-info blue-color"></i>&nbsp;Information de l'article
        </h3>

        <form>
          <div class="form-grid">
            <div class="field">
              <label>Code article</label>
              <input type="text" class="form-input" name="codearticle" placeholder="Ex : ART-001">
            </div>
            <div class="field">
              <label>Désignation</label>
              <input type="text" class="form-input" name="designation" placeholder="Nom de l'article">
            </div>
            <div class="field">
              <label>Prix unitaire HT</label>
              <input type="text" class="form-input" name="prixunitht" placeholder="0.00 €">
            </div>
            <div class="field">
              <label>Taux TVA</label>
              <input type="text" class="form-input" name="tauxtva" placeholder="Ex : 20">
            </div>
            <div class="field">
              <label>Prix unitaire TTC</label>
              <input type="text" class="form-input" name="prixunitttc" placeholder="0.00 €">
            </div>
            <div class="field">
              <label>Catégorie</label>
              <select class="form-input" name="cat">
                <option [value]="null">Sélectionner une catégorie</option>
                <option>Catégorie</option>
              </select>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <i class="fas fa-ban"></i>&nbsp;Annuler
      </button>
      <button type="button" class="btn btn-primary" (click)="enregistrerArticle()">
        <i class="fas fa-save"></i>&nbsp;Enregistrer
      </button>
    </div>
  </div>
</div>
